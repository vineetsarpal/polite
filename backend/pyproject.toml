[project]
name = "polite-backend"
version = "0.1.0"
description = "Polite — FastAPI backend for insurance policy management"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi[standard]>=0.115",
    "gunicorn>=23",
    "prometheus-fastapi-instrumentator>=7.1",
    "psycopg2>=2.9",
    "pydantic>=2.11",
    "python-dotenv>=1.1",
    "sqlalchemy>=2.0",
    "clerk-backend-api>=1.0",
    "svix>=1.20",
    "httpx>=0.27",
]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.uv]
package = false
