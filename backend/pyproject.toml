[project]
name = "polite-backend"
version = "0.1.0"
description = "Polite — FastAPI backend for insurance policy management"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi[standard]>=0.115",
    "gunicorn>=23",
    "passlib[bcrypt]>=1.7",
    "prometheus-fastapi-instrumentator>=7.1",
    "psycopg2>=2.9",
    "pydantic>=2.11",
    "pyjwt>=2.10",
    "python-dotenv>=1.1",
    "python-jose[cryptography]>=3.4",
    "sqlalchemy>=2.0",
]

[tool.uv]
package = false
