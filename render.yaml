# Polite — Render Blueprint
# Source of truth for Render services. Do not create services manually
# in the Render dashboard; this file owns service definitions.

# Root-level previews block enables PR-preview environments for the
# whole blueprint and sets the inactivity TTL. expireAfterDays only
# lives here — it is not a valid field on service-level `previews:`.
previews:
  generation: automatic
  expireAfterDays: 7

services:
  - type: web
    name: polite-api
    runtime: python
    plan: starter
    region: virginia
    rootDir: backend
    buildCommand: uv sync --frozen
    preDeployCommand: uv run alembic upgrade head
    startCommand: uv run gunicorn -w 4 -k uvicorn.workers.UvicornWorker src.main:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - fromGroup: polite-prod-secrets
      # DATABASE_URL is part of polite-prod-secrets and points at the
      # `production` Neon branch. PR-preview services initially inherit
      # this value; .github/workflows/pr-preview.yml then PATCHes the
      # preview service's DATABASE_URL via Render API to point at the
      # shared `preview` Neon branch (NEON_PREVIEW_DATABASE_URL secret).

  - type: cron
    name: polite-purge-deleted
    runtime: python
    plan: starter
    region: virginia
    rootDir: backend
    schedule: "0 3 * * *"
    buildCommand: uv sync --frozen
    startCommand: uv run python scripts/purge_deleted.py
    envVars:
      - fromGroup: polite-prod-secrets

envVarGroups:
  - name: polite-prod-secrets
    envVars:
      # Static secrets — values are pasted into the Render dashboard
      # manually after the group is provisioned. Listing keys here only
      # declares the group's structure; Render env-var-group entries do
      # not support `sync: false` (would be a YAML schema error).
      - key: DATABASE_URL
      - key: POLITE_APP_DB_PASSWORD
      - key: POLITE_ADMIN_DB_PASSWORD
      - key: OWNER_DB_USER
      - key: OWNER_DB_PASSWORD
      - key: CLERK_SECRET_KEY
      - key: CLERK_PUBLISHABLE_KEY
      - key: CLERK_WEBHOOK_SECRET
      - key: CLERK_JWT_ISSUER
      - key: FRONTEND_URL
      # DATABASE_URL_ADMIN and DATABASE_URL_MIGRATIONS are intentionally
      # omitted — the backend's _derive_urls() helper constructs them at
      # runtime from DATABASE_URL plus the role-password env vars above.
