# Polite — Render Blueprint
# Source of truth for Render services. Do not create services manually
# in the Render dashboard; this file owns service definitions.

# NOTE: Preview Environments require Render's Pro workspace (paid).
# On Hobby workspace (free-tier dry-run), the `previews:` block is
# rejected by the blueprint validator. Re-add the following when
# upgrading to Pro:
#
#   previews:
#     generation: automatic
#     expireAfterDays: 7
#
# Until then, .github/workflows/pr-preview.yml will skip on every PR
# (no Render preview service exists for it to find) and Vercel
# previews always point at prod backend. Frontend-only review still
# works; full-stack review is deferred to Pro upgrade.

services:
  - type: web
    name: polite-api
    runtime: python
    # `free` plan: accept 15-min spin-down + ~30-60s cold start. Suitable
    # for pre-revenue dry-run. Upgrade to `starter` (~$7/mo) before any
    # design partner gets the URL.
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: uv sync --frozen
    # preDeployCommand is paid-tier-only on Render. On the free plan we
    # chain `alembic upgrade head` into startCommand instead. Idempotent
    # (~1s no-op when already at head); runs on every cold-start. When
    # upgrading to starter, hoist alembic back into preDeployCommand to
    # restore atomic schema+code deploys (failure aborts before traffic
    # switch instead of failing health check after).
    startCommand: uv run alembic upgrade head && uv run gunicorn -w 4 -k uvicorn.workers.UvicornWorker src.main:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - fromGroup: polite-prod-secrets
      # DATABASE_URL is part of polite-prod-secrets and points at the
      # `production` Neon branch. PR-preview services initially inherit
      # this value; .github/workflows/pr-preview.yml then PATCHes the
      # preview service's DATABASE_URL via Render API to point at the
      # shared `preview` Neon branch (NEON_PREVIEW_DATABASE_URL secret).

  # The `polite-purge-deleted` cron job is intentionally NOT declared
  # here at v1 — Render Cron Jobs have no free tier. Run purge manually
  # via `uv run python scripts/purge_deleted.py` until paid plan is on.
  # Re-add the cron block when upgrading; spec §6 / plan Task 6 has the
  # original definition.

# NOTE: the `polite-prod-secrets` env-var group is **NOT** declared
# inline here. Render's blueprint schema requires both key AND value
# for every entry under `envVarGroups[].envVars`, which is incompatible
# with secrets we don't want to commit. The group is created and
# populated manually in the Render dashboard before the blueprint is
# applied; `fromGroup: polite-prod-secrets` above just references it.
#
# Required keys in the externally-managed group (set in dashboard):
#   - DATABASE_URL                 (production Neon branch pooled URL)
#   - POLITE_APP_DB_PASSWORD
#   - POLITE_ADMIN_DB_PASSWORD
#   - OWNER_DB_USER
#   - OWNER_DB_PASSWORD
#   - CLERK_SECRET_KEY
#   - CLERK_PUBLISHABLE_KEY
#   - CLERK_WEBHOOK_SECRET
#   - CLERK_JWT_ISSUER
#   - FRONTEND_URL
#
# DATABASE_URL_ADMIN and DATABASE_URL_MIGRATIONS are intentionally
# omitted — the backend's _derive_urls() helper constructs them at
# runtime from DATABASE_URL plus the role-password env vars above.
