name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # never cancel an in-flight prod deploy

jobs:
  deploy-backend:
    name: Trigger Render deploy and wait
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
        run: |
          if [ -z "$SERVICE_ID" ]; then
            echo "::warning ::RENDER_BACKEND_SERVICE_ID is not set — skipping (first deploy is via Render git auto-deploy, not GH Actions)."
            echo "skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          response=$(curl -s -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -d '{"clearCache": "do_not_clear"}')
          deploy_id=$(echo "$response" | jq -r '.id')
          if [ -z "$deploy_id" ] || [ "$deploy_id" = "null" ]; then
            echo "::error ::Failed to trigger Render deploy"
            echo "$response"
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> $GITHUB_OUTPUT
          echo "Triggered Render deploy: $deploy_id"

      - name: Poll for deploy completion
        if: steps.trigger.outputs.skipped != 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              | jq -r '.status')
            echo "Poll $i: status=$status"
            case "$status" in
              live|deactivated)
                echo "Deploy succeeded."
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "::error ::Render deploy failed (status=$status)"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error ::Deploy did not reach a terminal state within 10 minutes"
          exit 1

  smoke-check:
    name: Production smoke check
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: success()
    steps:
      - name: Health endpoint returns 200
        run: |
          status=$(curl -s -o /tmp/body -w '%{http_code}' https://polite-api.onrender.com/api/v1/health)
          cat /tmp/body
          if [ "$status" != "200" ]; then
            echo "::error ::Health check returned $status"
            exit 1
          fi
      - name: OpenAPI schema reachable
        run: |
          curl -s https://polite-api.onrender.com/openapi.json | jq -e '.paths | keys | length > 0' > /dev/null
